services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    restart: always
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnamilegacy/kafka:3.4
    restart: always
    ports:
      - "9092:9092"
    volumes:
      - "kafka_data:/bitnami"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://:9092
    depends_on:
      - zookeeper

  mysql:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_DATABASE=bd
      - MYSQL_USER=user_microservicios
      - MYSQL_PASSWORD=AD23903IDJD
      - MYSQL_ROOT_PASSWORD=AD23903IDJD
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_microservice:/var/lib/mysql

volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
  mysql_data_microservice:
    driver: local

networks:
  default:
    name: banking-network
    external: true
